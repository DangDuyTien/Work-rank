<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="wr-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Gold Gradients for Facets -->
    <linearGradient id="wr-gold-facet1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="45%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <linearGradient id="wr-gold-facet2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="wr-gold-facet3" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eab308" />
      <stop offset="60%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="wr-gold-facet4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Apex & Accent -->
    <linearGradient id="wr-gold-crown" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="50%" stop-color="#fffbeb" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <!-- Border Accent -->
    <linearGradient id="wr-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(250, 204, 21, 0.45)" />
      <stop offset="50%" stop-color="rgba(234, 179, 8, 0.15)" />
      <stop offset="100%" stop-color="rgba(217, 119, 6, 0.4)" />
    </linearGradient>

    <filter id="wr-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base (Bo tròn mềm mại 22%) -->
  <rect width="100" height="100" rx="22" fill="url(#wr-bg)" />
  <rect x="1.5" y="1.5" width="97" height="97" rx="20.5" fill="none" stroke="url(#wr-border)" stroke-width="1.75" />

  <!-- Soft Ambient Gold Glow Behind Mark -->
  <circle cx="50" cy="52" r="26" fill="#eab308" opacity="0.16" filter="url(#wr-glow)" />

  <!-- The Iconic Golden "W" Facets -->
  <!-- Left Outer Blade -->
  <path d="M17 25 L25 25 L37 75 L29 75 Z" fill="url(#wr-gold-facet1)" />

  <!-- Left Inner Face -->
  <path d="M25 25 L32 25 L43 61 L50 36 L50 56 L44 75 L37 75 Z" fill="url(#wr-gold-facet2)" />

  <!-- Right Inner Face -->
  <path d="M50 36 L57 61 L68 25 L75 25 L63 75 L56 75 L50 56 Z" fill="url(#wr-gold-facet3)" />

  <!-- Right Outer Blade -->
  <path d="M75 25 L83 25 L71 75 L63 75 Z" fill="url(#wr-gold-facet4)" />

  <!-- Center Apex Crown Notch / Diamond -->
  <path d="M50 18 L54.5 24 L50 29.5 L45.5 24 Z" fill="url(#wr-gold-crown)" />
  <circle cx="50" cy="24" r="1.5" fill="#ffffff" />
</svg>
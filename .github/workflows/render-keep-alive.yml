name: Render Web Service Keep-Alive

on:
  schedule:
    # Trigger every 10 minutes (avoids Render's 15-minute idle spin-down)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  keep-alive:
    name: Ping Render Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping WorkRank Backend Health Endpoint
        run: |
          TARGET_URL="${{ vars.KEEP_ALIVE_URL || 'https://work3winmedia.onrender.com/health' }}"
          echo "[keep-alive] Pinging health probe at: ${TARGET_URL}"
          
          # Perform GET request with anti-cache header and 15s timeout
          RESPONSE=$(curl -sS -w "\nHTTP_STATUS:%{http_code}\nTIME_TOTAL:%{time_total}s" \
            --max-time 15 \
            -H "User-Agent: WorkRank-KeepAlive/1.0 (GitHubActions)" \
            -H "Cache-Control: no-cache" \
            "${TARGET_URL}")
          
          HTTP_STATUS=$(echo "${RESPONSE}" | grep "HTTP_STATUS:" | cut -d: -f2)
          TIME_TOTAL=$(echo "${RESPONSE}" | grep "TIME_TOTAL:" | cut -d: -f2)
          BODY=$(echo "${RESPONSE}" | grep -v "HTTP_STATUS:" | grep -v "TIME_TOTAL:")
          
          echo "[keep-alive] Response status: ${HTTP_STATUS} (took ${TIME_TOTAL})"
          echo "[keep-alive] Response body: ${BODY}"
          
          if [ "${HTTP_STATUS}" -eq 200 ]; then
            echo "[keep-alive] Web Service is active and responsive (HTTP 200 OK)."
          else
            echo "[keep-alive] Notice: Service returned HTTP ${HTTP_STATUS}. It may be undergoing cold start or deploy."
          fi

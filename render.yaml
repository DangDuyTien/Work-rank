services:
  - type: web
    runtime: node
    name: workrank-duy-tien
    plan: free
    region: singapore
    buildCommand: npm --prefix backend ci && npm --prefix frontend ci --include=dev && npm --prefix frontend run build
    startCommand: npm --prefix backend start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://workrank-duy-tien.onrender.com
      - key: DB_DIALECT
        value: mysql
      - key: DB_SSL
        value: true
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: VITE_DESKTOP_WINDOWS_DOWNLOAD_URL
        value: /downloads/WorkRank%20Tracker-Setup-1.0.0-x64.exe
      - key: DESKTOP_WINDOWS_DOWNLOAD_URL
        sync: false

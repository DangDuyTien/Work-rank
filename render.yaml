services:
  - type: web
    runtime: node
    name: work3winmedia
    plan: free
    region: singapore
    buildCommand: npm --prefix backend ci --omit=dev && npm --prefix frontend ci --include=dev && npm --prefix frontend run build
    startCommand: npm --prefix backend run db:migrate && npm --prefix backend start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://work3winmedia-c94e.onrender.com
      - key: DB_DIALECT
        value: mysql
      - key: DB_SSL
        value: true
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      # ── Drawing image storage (bắt buộc — production KHÔNG dùng local disk) ──
      - key: STORAGE_PROVIDER
        value: s3
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_REGION
        value: auto
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: STORAGE_PUBLIC_BASE_URL
        sync: false
      - key: STORAGE_FORCE_PATH_STYLE
        value: "true"
      # ── Private Media (owner-only capability) ──
      # Bật YouTube Data API v3 trong Google Cloud rồi dán key vào dashboard.
      - key: YOUTUBE_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: PRIVATE_MEDIA_BOOTSTRAP_OWNER_EMAIL
        value: tienddph50842@gmail.com

